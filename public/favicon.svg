    <rect x="29.5" y="20" width="5" height="8" fill="#c3272b"/>
    <!-- pillars -->
    <path d="M14 21 L20 21 L21.5 56 L12.5 56 Z" fill="#c3272b"/>
    <path d="M44 21 L50 21 L51.5 56 L42.5 56 Z" fill="#c3272b"/>
