name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Required gate: the production build must succeed.
      - run: npm run build
      # Informational only: astro check currently reports pre-existing type
      # errors in inline client scripts. Surfaced for visibility, not enforced.
      - run: npm run check
        continue-on-error: true
